<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cars Dealership | Find your next car</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --ink: #172a32; --muted: #61727a; --line: #dce5e7; --paper: #f3f6f4; --teal: #087f75; --lime: #d5f064; }
    body { background: var(--paper); color: var(--ink); font-family: "DM Sans", sans-serif; }
    h1, h2, .navbar-brand { font-family: "Manrope", sans-serif; }
    .navbar { background: var(--ink); }
    .navbar-brand { font-weight: 800; }
    .nav-link { color: #d7e2e2; }
    .nav-link:hover, .nav-link.active { color: var(--lime); }
    .masthead { background: linear-gradient(115deg, #17343a 0%, #205e59 62%, #77a88d 100%); color: white; }
    .masthead-inner { padding: 3.25rem 0 3.5rem; }
    .eyebrow { color: var(--lime); font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .masthead h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; max-width: 720px; }
    .masthead p { color: #dce9e5; max-width: 620px; }
    .toolbar { border-bottom: 1px solid var(--line); padding: 1.15rem 0; }
    .login-panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 1rem; }
    .table-wrap { background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
    .table { margin: 0; min-width: 760px; }
    .table thead th { background: #e8f0ed; color: #31484d; font-size: .78rem; text-transform: uppercase; }
    .table td, .table th { padding: .9rem 1rem; vertical-align: middle; }
    .table a { color: var(--teal); font-weight: 700; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .btn-teal { background: var(--teal); border-color: var(--teal); color: #fff; }
    .btn-teal:hover { background: #06695f; color: white; }
    .subtle { color: var(--muted); }
    [hidden] { display: none !important; }
    @media (max-width: 767px) { .masthead-inner { padding: 2.5rem 0; } .toolbar .container { align-items: stretch !important; flex-direction: column; } }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container"><a class="navbar-brand" href="/">Cars Dealership</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="siteNav"><div class="navbar-nav ms-auto"><a class="nav-link active" aria-current="page" href="/">Home</a><a class="nav-link" href="/static/About.html">About</a><a class="nav-link" href="/static/Contact.html">Contact</a></div></div>
    </div>
  </nav>
  <header class="masthead"><div class="container masthead-inner"><p class="eyebrow mb-2">A better drive starts here</p><h1>Find a dealership that feels right.</h1><p class="mb-0">Explore trusted local dealers, compare locations, and hear directly from drivers.</p></div></header>
  <main class="container py-4">
    <section class="login-panel mb-4" id="accountPanel" data-authenticated="{% if request.user.is_authenticated %}true{% else %}false{% endif %}" data-username="{{ request.user.username }}" aria-label="Account">
      <form class="row g-2 align-items-end" id="loginForm">
        <div class="col-12 col-md-4"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" autocomplete="username" required></div>
        <div class="col-12 col-md-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <div class="col-12 col-md-auto"><button class="btn btn-teal" type="submit">Login</button></div>
        <div class="col-12"><p class="small mb-0" id="loginMessage" role="status"></p></div>
      </form>
      <div class="d-flex align-items-center justify-content-between gap-3" id="signedInPanel" hidden>
        <p class="mb-0">Signed in as <strong id="signedInUsername"></strong></p><button class="btn btn-outline-dark btn-sm" id="logoutButton" type="button">Logout</button>
      </div>
    </section>
    <section aria-labelledby="dealersHeading">
      <div class="toolbar mb-3"><div class="container-fluid px-0 d-flex justify-content-between align-items-center gap-3"><div><h2 class="h4 mb-1" id="dealersHeading">Dealerships</h2><p class="subtle small mb-0" id="dealerCount">Loading dealerships…</p></div><div class="d-flex align-items-center gap-2"><label for="stateFilter" class="form-label mb-0">State</label><select class="form-select" id="stateFilter" aria-label="Filter dealers by state"><option value="">All</option></select></div></div></div>
      <p class="text-danger" id="dealerError" role="alert" hidden></p>
      <div class="table-wrap"><table class="table table-hover"><thead><tr id="dealerHeaders"><th scope="col">ID</th><th scope="col">Dealer Name</th><th scope="col">City</th><th scope="col">Address</th><th scope="col">Zip</th><th scope="col">State</th></tr></thead><tbody id="dealerRows"><tr><td class="subtle" colspan="6">Loading…</td></tr></tbody></table></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/djangoapp/js/Home.js"></script>
</body>
</html>

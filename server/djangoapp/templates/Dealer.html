<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dealership | Cars Dealership</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --ink: #172a32; --muted: #61727a; --line: #dce5e7; --paper: #f3f6f4; --teal: #087f75; --lime: #d5f064; }
    body { background: var(--paper); color: var(--ink); font-family: "DM Sans", sans-serif; }
    h1, h2, .navbar-brand { font-family: "Manrope", sans-serif; }
    .navbar { background: var(--ink); }
    .navbar-brand { font-weight: 800; }
    .nav-link { color: #d7e2e2; }
    .nav-link:hover { color: var(--lime); }
    .dealer-band { background: linear-gradient(115deg, #17343a, #205e59 70%, #77a88d); color: #fff; padding: 2.8rem 0; }
    .eyebrow { color: var(--lime); font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .detail-table { background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .detail-table th { color: var(--muted); font-weight: 600; width: 130px; }
    .detail-table td, .detail-table th { padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
    .review-card { background: #fff; border: 1px solid var(--line); border-radius: 8px; height: 100%; padding: 1.15rem; }
    .sentiment { border-radius: 20px; font-size: .75rem; font-weight: 700; padding: .25rem .6rem; text-transform: capitalize; }
    .sentiment-positive { background: #d9f4e3; color: #17613a; }
    .sentiment-neutral { background: #e7eef0; color: #42575f; }
    .sentiment-negative { background: #fce1dd; color: #9c3428; }
    .subtle { color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand" href="/">Cars Dealership</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="siteNav"><div class="navbar-nav ms-auto"><a class="nav-link" href="/">Home</a><a class="nav-link" href="/static/About.html">About</a><a class="nav-link" href="/static/Contact.html">Contact</a></div></div></div></nav>
  <header class="dealer-band"><div class="container"><p class="eyebrow mb-2">Dealership <span id="dealerId">#{{ dealer_id }}</span></p><h1 class="display-5 fw-bold mb-1" id="dealerName">Loading dealership…</h1><p class="mb-0" id="dealerLocation"></p></div></header>
  <main class="container py-4" id="dealerPage" data-dealer-id="{{ dealer_id }}" data-authenticated="{% if request.user.is_authenticated %}true{% else %}false{% endif %}">
    <div class="d-flex justify-content-between align-items-center gap-3 mb-4"><h2 class="h4 mb-0">Location details</h2><a class="btn btn-teal btn-sm" id="reviewDealerLink" href="/postreview/{{ dealer_id }}" hidden>Review Dealer</a></div>
    <div class="detail-table mb-5"><table class="table mb-0"><tbody><tr><th scope="row">Address</th><td id="dealerAddress">Loading…</td></tr><tr><th scope="row">City</th><td id="dealerCity"></td></tr><tr><th scope="row">Zip</th><td id="dealerZip"></td></tr><tr><th scope="row">State</th><td id="dealerState"></td></tr></tbody></table></div>
    <div class="d-flex justify-content-between align-items-baseline mb-3"><h2 class="h4 mb-0">Driver reviews</h2><span class="subtle small" id="reviewCount"></span></div>
    <p class="text-danger" id="dealerError" role="alert" hidden></p>
    <div class="row g-3" id="reviewCards"><div class="col-12 subtle">Loading reviews…</div></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/djangoapp/js/Dealer.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post Review | Cars Dealership</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --ink: #172a32; --muted: #61727a; --line: #dce5e7; --paper: #f3f6f4; --teal: #087f75; --lime: #d5f064; }
    body { background: var(--paper); color: var(--ink); font-family: "DM Sans", sans-serif; }
    h1, h2, .navbar-brand { font-family: "Manrope", sans-serif; }
    .navbar { background: var(--ink); }
    .navbar-brand { font-weight: 800; }
    .nav-link { color: #d7e2e2; }
    .nav-link:hover { color: var(--lime); }
    .review-band { background: linear-gradient(115deg, #17343a, #205e59 70%, #77a88d); color: #fff; padding: 2.6rem 0; }
    .eyebrow { color: var(--lime); font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .review-form { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: clamp(1.1rem, 3vw, 2rem); }
    .btn-teal { background: var(--teal); border-color: var(--teal); color: #fff; }
    .btn-teal:hover { background: #06695f; color: #fff; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand" href="/">Cars Dealership</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="siteNav"><div class="navbar-nav ms-auto"><a class="nav-link" href="/">Home</a><a class="nav-link" href="/static/About.html">About</a><a class="nav-link" href="/static/Contact.html">Contact</a></div></div></div></nav>
  <header class="review-band"><div class="container"><p class="eyebrow mb-2">Your experience matters</p><h1 class="display-5 fw-bold mb-1">Post Review</h1><p class="mb-0" id="dealerName">Loading dealership…</p></div></header>
  <main class="container py-4">
    <form class="review-form" id="reviewForm" data-dealer-id="{{ dealer_id }}" data-reviewer="{{ request.user.username }}">
      <div class="mb-3"><label class="form-label" for="review">Review</label><textarea class="form-control" id="review" name="review" rows="5" maxlength="2000" required></textarea></div>
      <div class="row g-3">
        <div class="col-12 col-md-6"><label class="form-label" for="carMake">Car Make</label><select class="form-select" id="carMake" required><option value="">Choose a make</option></select></div>
        <div class="col-12 col-md-6"><label class="form-label" for="carModel">Car Model</label><select class="form-select" id="carModel" required disabled><option value="">Choose a make first</option></select></div>
        <div class="col-12 col-md-6"><label class="form-label" for="carYear">Car Year</label><input class="form-control" id="carYear" type="number" min="2015" max="2023" inputmode="numeric" required></div>
        <div class="col-12 col-md-6"><label class="form-label" for="purchaseDate">Purchase Date</label><input class="form-control" id="purchaseDate" type="date" required></div>
      </div>
      <div class="form-check my-3"><input class="form-check-input" id="purchased" type="checkbox"><label class="form-check-label" for="purchased">I purchased this vehicle</label></div>
      <p class="text-danger" id="reviewError" role="alert" hidden></p>
      <button class="btn btn-teal" id="submitReview" type="submit">Post Review</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/djangoapp/js/PostReview.js"></script>
</body>
</html>

name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint_python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python lint tools
        run: python -m pip install flake8
      - name: Lint Python
        run: flake8 server --max-line-length=120

  lint_js:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint JavaScript
        run: npx --yes jshint server/database/*.js

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cars-dealership-django
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cars-dealership-django
  template:
    metadata:
      labels:
        app: cars-dealership-django
    spec:
      containers:
        - name: django
          image: cars-dealership-django:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_SERVICE_URL
              value: http://cars-dealership-database:3030
            - name: SENTIMENT_SERVICE_URL
              value: http://cars-dealership-sentiment:5050
---
apiVersion: v1
kind: Service
metadata:
  name: cars-dealership-django
spec:
  selector:
    app: cars-dealership-django
  ports:
    - port: 8000
      targetPort: 8000